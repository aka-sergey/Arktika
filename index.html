<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Завод воды АРКТИКА</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Раскладка: табло цели сверху, под ним главная сцена — лента времени с дорожками, ниже рабочие вкладки со списками и рычагами */
:root{
  /* Единый тёмный вид: пульт наблюдения + крипто-терминал. Зелёный — деньги и «в плюсе», красный — траты и «в минусе», жёлтый — акцент и внимание, бирюзовый — склад. */
  --bg:#0B0E11; --surface:#12161C; --sunken:#1B212B; --ink:#EAECEF; --muted:#8A94A3; --line:#262D38;
  --brand:#16C784; --brand-soft:#0E2C22; --on-brand:#06120D;
  --accent:#F0B90B; --on-accent:#14110A; --accent-ink:#F0B90B;
  --field:#1B212B; --field-line:#647082; --field-hot:#F0B90B;
  --water:#22D3EE; --water-soft:#0C2A33; --amber:#F0B90B; --amber-soft:#2C2408; --red:#F6465D; --red-soft:#34151B; --gold:#FFE08A;
  --office:#A78BFA; --office-soft:#221C3D; --capex:#F5822A;
  --display:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace; --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --body:'Golos Text',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:6px; --sb:44px; color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#F3F4F7; --surface:#FFFFFF; --sunken:#EDEFF3; --ink:#0B0E11; --muted:#5B6472; --line:#D5DAE2;
  --brand:#0A7A54; --brand-soft:#DAF2E8; --on-brand:#FFFFFF;
  --accent:#F0B90B; --on-accent:#14110A; --accent-ink:#8F6400;
  --field:#F6F7F9; --field-line:#8590A0; --field-hot:#9A6B00;
  --water:#087A96; --water-soft:#D6F0F6; --amber:#8A5A00; --amber-soft:#FBF0CC; --red:#C01F38; --red-soft:#FBE0E4; --gold:#C99400;
  --office:#6D4FE0; --office-soft:#E7E1FB; --capex:#C2570A; color-scheme:light } }
:root[data-theme="light"]{
  --bg:#F3F4F7; --surface:#FFFFFF; --sunken:#EDEFF3; --ink:#0B0E11; --muted:#5B6472; --line:#D5DAE2;
  --brand:#0A7A54; --brand-soft:#DAF2E8; --on-brand:#FFFFFF;
  --accent:#F0B90B; --on-accent:#14110A; --accent-ink:#8F6400;
  --field:#F6F7F9; --field-line:#8590A0; --field-hot:#9A6B00;
  --water:#087A96; --water-soft:#D6F0F6; --amber:#8A5A00; --amber-soft:#FBF0CC; --red:#C01F38; --red-soft:#FBE0E4; --gold:#C99400;
  --office:#6D4FE0; --office-soft:#E7E1FB; --capex:#C2570A; color-scheme:light }
html{background:var(--bg)}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;font-variant-numeric:tabular-nums}
.wrap{max-width:1480px;margin:0 auto;padding-block:16px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--water);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
.top{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand h1{font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:.04em;text-transform:uppercase}
.brand span{color:var(--muted);font-size:12.5px;white-space:nowrap}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-width:0;max-width:100%}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--field-line);background:var(--sunken)} .btn.pri:hover{background:var(--accent);border-color:var(--accent);filter:brightness(1.07)} .btn:disabled:hover{background:var(--surface);border-color:var(--line)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.ghost{background:transparent}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:default}
select,input{border:1px solid var(--field-line);background:var(--field);border-radius:6px;padding:6px 8px;min-width:0;transition:border-color .12s,box-shadow .12s}
select:hover,input:hover{border-color:var(--field-hot)}
select:focus-visible,input:focus-visible{outline:none;border-color:var(--field-hot);box-shadow:0 0 0 2px var(--field-hot)}
input[type=checkbox]{box-shadow:none}
input.num{text-align:right;width:100%;min-width:88px;max-width:140px;font-family:var(--mono);font-size:13px}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
/* табло */
.score{display:grid;grid-template-columns:minmax(300px,1.7fr) repeat(4,minmax(150px,1fr));gap:0;align-items:stretch}
.goal{border-radius:var(--r) 0 0 var(--r);padding:12px 16px;background:var(--sunken);display:flex;flex-direction:column;gap:6px;justify-content:center;min-width:0}
.led{display:inline-block;flex:0 0 auto;width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 10px var(--red)} .ok>.led,.ok .led{background:var(--brand);box-shadow:0 0 10px var(--brand)}
.goal .led{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;background:var(--red);box-shadow:0 0 10px var(--red)} .goal.ok .led{background:var(--brand);box-shadow:0 0 10px var(--brand)}
.goal .verdict{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--red)} .goal.ok .verdict{color:var(--brand)}
.goal .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.goal b{font-size:14.5px;font-weight:600;line-height:1.3}
.goal .status{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.debtrow{display:flex;align-items:center;gap:10px} .debtrow .debt{flex:1} .debtrow span{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
.debt{height:8px;border-radius:2px;background:var(--bg);overflow:hidden}
.debt i{display:block;height:100%;border-radius:2px}
.metric{position:relative;padding:12px 14px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:3px;min-width:0;justify-content:center}
.metric .lab{color:var(--muted);font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase}
.metric .val{font-family:var(--display);font-weight:700;font-size:23px;letter-spacing:-.02em;white-space:nowrap}
.metric .val small{font-family:var(--body);font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0}
.delta{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.delta.good{color:var(--brand)} .delta.bad{color:var(--red)}
.missions{display:flex;flex-direction:column;gap:8px}
.missrow{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;min-height:30px}
.missbtn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px 4px 10px;font-size:13px;color:var(--ink)} .missbtn:hover{border-color:var(--field-line)} .missbtn b{font-weight:600}
.chev{display:inline-block;width:12px;color:var(--muted);font-size:11px}
.pips{display:inline-flex;gap:3px;margin-left:2px} .pips i{width:7px;height:7px;border-radius:2px;background:var(--line)} .pips i.on{background:var(--brand)}
.misslist{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 10px 4px 6px;font-size:12.5px;background:var(--surface);color:var(--muted)}
.chip i{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line);display:inline-grid;place-items:center;font-style:normal;font-size:10px;line-height:1}
.chip.done{color:var(--ink);border-color:var(--brand)} .chip.done i{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.chip.record{border-color:var(--field-line);color:var(--ink)} .chip.record i{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.alerts{display:flex;flex-direction:column;gap:6px} .alerts:empty{display:none}
/* подсказка у плитки прибыли */
.qd{position:absolute;right:10px;top:38px} .qd summary{list-style:none;cursor:pointer;width:20px;height:20px;border-radius:50%;border:1px solid var(--field-line);color:var(--muted);font-family:var(--mono);font-size:11.5px;font-weight:600;display:grid;place-items:center;background:var(--surface)} .qd summary::-webkit-details-marker{display:none}
.qd summary:hover,.qd[open] summary{color:var(--ink);border-color:var(--ink)} .qd summary:focus-visible{outline:2px solid var(--field-hot);outline-offset:1px}
.pop{position:absolute;right:-2px;top:26px;z-index:11;width:min(340px,calc(100vw - 40px));background:var(--surface);border:1px solid var(--field-line);border-radius:8px;padding:12px 14px;box-shadow:0 12px 34px rgba(0,0,0,.45);font-size:12.5px;line-height:1.45;display:flex;flex-direction:column;gap:8px}
.pop dl{margin:0;display:grid;grid-template-columns:1fr auto;gap:4px 14px} .pop dt{color:var(--muted)} .pop dd{margin:0;text-align:right;font-family:var(--mono);font-weight:600;white-space:nowrap} .pop dt:last-of-type,.pop dd:last-of-type{border-top:1px solid var(--line);padding-top:4px}
.pop p{margin:0;color:var(--ink)} .pop p.pp{font-family:var(--mono);font-size:11px;color:var(--muted)}
/* движение */
.mv{font-family:var(--mono);font-size:11.5px;font-weight:600;white-space:nowrap;animation:mvin 1.5s ease both} .mv.good{color:var(--brand)} .mv.bad{color:var(--red)}
.metric .mv{position:absolute;right:12px;bottom:10px;padding:2px 8px;border-radius:999px;background:var(--sunken);z-index:1}
.sb-c .mv{display:none;font-size:9.5px;letter-spacing:.02em} .sb-c.moved .l{display:none} .sb-c.moved .mv{display:inline}
@keyframes mvin{0%{opacity:0;transform:translateY(5px)}12%{opacity:1;transform:none}86%{opacity:1}100%{opacity:0}}
.goal.flip{animation:gfr .8s ease-out 1} .goal.ok.flip{animation-name:gfg}
@keyframes gfr{0%{box-shadow:inset 0 0 0 2px var(--red),inset 0 0 46px color-mix(in srgb,var(--red) 50%,transparent)}100%{box-shadow:inset 0 0 0 2px transparent,inset 0 0 46px transparent}}
@keyframes gfg{0%{box-shadow:inset 0 0 0 2px var(--brand),inset 0 0 46px color-mix(in srgb,var(--brand) 50%,transparent)}100%{box-shadow:inset 0 0 0 2px transparent,inset 0 0 46px transparent}}
.flash{animation:ffl .6s ease-out 1}
@keyframes ffl{0%{box-shadow:0 0 0 3px var(--water);background-color:color-mix(in srgb,var(--water) 24%,var(--field))}100%{box-shadow:0 0 0 3px transparent}}
.rv{animation:rvl .18s ease-out 1} @keyframes rvl{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
.closing{opacity:0!important;transform:translateY(-5px);transition:opacity .18s ease,transform .18s ease}
#tl-svg{overflow:hidden;transition:height .18s ease} .tl-labels{transition:height .18s ease}
.alert{border-radius:8px;padding:8px 12px;font-size:13px;display:flex;gap:10px;align-items:baseline;background:var(--amber-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--amber) 35%,transparent)}
.alert.err{background:var(--red-soft);border-color:color-mix(in srgb,var(--red) 40%,transparent)}
.alert b{color:var(--amber);font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap} .alert.err b{color:var(--red)}
/* лента времени */
.tl{padding:10px 0 6px;display:flex;flex-direction:column;gap:7px}
.tl-head{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;padding:0 14px}
.tl-head h2{font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 11px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:600}
.tl-body{display:grid;grid-template-columns:168px minmax(0,1fr);position:relative}
.tl-labels{position:relative;border-right:1px solid var(--line)}
.tl-labels>*{position:absolute;left:14px;right:8px;font-size:12px;line-height:1.25;text-align:left}
.tl-labels b,.tl-labels>*>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .tl-labels>*>span{display:block}
.lanebtn{border:0;background:transparent;padding:2px 4px 3px;margin:-2px -4px 0;border-radius:5px;color:inherit;cursor:pointer} .lanebtn:hover{background:var(--sunken)} .lanebtn .chev{width:11px;font-size:10px}
.hdl{cursor:grab}
.draghint{position:absolute;right:12px;bottom:10px;z-index:4;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--field-line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:12.5px;box-shadow:0 6px 20px rgba(0,0,0,.35);max-width:calc(100% - 24px)}
.draghint[hidden]{display:none} .draghint i{flex:0 0 auto;width:9px;height:9px;border-radius:50%;border:1.6px solid var(--ink);background:var(--surface)} .draghint span{color:var(--muted);font-size:11px} .draghint:hover{border-color:var(--field-hot)}
.tl-labels b{display:block;font-weight:600;font-size:12.5px}
.tl-labels>*>span{color:var(--muted);font-size:11px}
.tl-scroll{overflow-x:auto;overflow-y:hidden;position:relative}
.tl-scroll svg{display:block;touch-action:pan-x pan-y}
.tl-scroll svg text{font-family:var(--mono);font-size:10px;fill:var(--muted)}
.tl-scroll svg .t-ink{fill:var(--ink)} .tl-scroll svg .t-on{fill:var(--on-brand)} .tl-scroll svg .t-b{font-weight:600}
[data-drag]{cursor:grab;touch-action:none} [data-drag]:hover{filter:brightness(1.15)}
.tip{position:absolute;top:50px;z-index:3;pointer-events:none;background:var(--surface);border:1px solid var(--field-line);border-radius:4px;padding:9px 11px;font-size:12px;width:276px;box-shadow:0 8px 28px rgba(0,0,0,.55)}
.tip h4{margin:0 0 5px;font-size:12.5px} .tip dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 10px} .tip dt{color:var(--muted)} .tip dd{margin:0;text-align:right;font-weight:500;font-family:var(--mono);font-size:11.5px}
.tip ul{margin:6px 0 0;padding:6px 0 0;border-top:1px solid var(--line);list-style:none;display:flex;flex-direction:column;gap:2px}
.tip li{display:flex;justify-content:space-between;gap:8px} .tip li span:last-child{white-space:nowrap;font-weight:500}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11.5px;color:var(--muted);padding:0 14px}
.legend b{font-weight:400;margin-right:5px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
/* вкладки */
.tabs{position:sticky;top:var(--sb);z-index:9;background:var(--surface);border-bottom:1px solid var(--line);border-radius:var(--r) var(--r) 0 0;padding:8px 10px 0;display:flex;flex-direction:column;gap:6px}
.mg{display:flex;flex-wrap:wrap;gap:4px}
.mg button{border:1px solid transparent;background:transparent;border-radius:6px;padding:5px 12px;font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;white-space:nowrap}
.mg button:hover{background:var(--sunken);color:var(--ink)}
.mg button[aria-selected="true"]{background:var(--field);border-color:var(--field-line);color:var(--ink);font-weight:600}
.mt{display:flex;flex-wrap:wrap;gap:2px}
.mt button{border:0;background:transparent;padding:8px 14px;border-radius:6px 6px 0 0;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.mt button:hover{background:var(--sunken);color:var(--ink)}
.mt button[aria-selected="true"]{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent-ink);font-weight:600;border-bottom-color:var(--accent)}
.sbar{position:fixed;top:0;left:0;right:0;z-index:12;height:var(--sb);background:var(--surface);border-bottom:1px solid var(--line);box-shadow:0 6px 18px rgba(0,0,0,.28)} .sbar[hidden]{display:none}
.sbar-in{max-width:1480px;height:100%;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:22px;min-width:0;overflow:hidden}
.sb-st{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--red);white-space:nowrap} .sb-st.ok{color:var(--brand)}
.sb-c{display:flex;flex-direction:column;line-height:1.2;white-space:nowrap;min-width:0}
.sb-c small{font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.sb-c b{font-family:var(--display);font-size:14.5px;font-weight:700;letter-spacing:-.01em} .sb-c b small{font-family:var(--body);font-size:11px;font-weight:500;letter-spacing:0;text-transform:none}
.sbar .btn{margin-left:auto;display:inline-flex;gap:6px;align-items:center}
.more{position:relative} .more summary{list-style:none;cursor:pointer;font-weight:700;letter-spacing:.05em} .more summary::-webkit-details-marker{display:none} .more[open] summary{border-color:var(--field-line);background:var(--sunken)}
.menu{position:absolute;right:0;top:calc(100% + 6px);z-index:14;min-width:200px;background:var(--surface);border:1px solid var(--field-line);border-radius:8px;padding:4px;display:flex;flex-direction:column;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.menu button{border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:6px;font-weight:500;white-space:nowrap} .menu button:hover:not(:disabled){background:var(--sunken)} .menu button:disabled{opacity:.45;cursor:default}
.panel{padding:16px;display:flex;flex-direction:column;gap:16px;min-width:0}
.panel h3{font-family:var(--mono);font-size:12.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase}
.panel p{margin:0;color:var(--muted);max-width:75ch}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,.hd>span{text-align:left;font-weight:500;color:var(--muted);font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
th{padding:6px 8px;border-bottom:1px solid var(--line)} .hd>span{white-space:normal}
td{padding:4px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right} td.r{font-family:var(--mono);font-size:12.5px} td.calc,span.calc{color:var(--muted);white-space:nowrap;font-family:var(--mono);font-size:12.5px}
td input,td select{width:100%} td input[type=checkbox]{width:auto}
td.name{min-width:240px;width:60%} td.n{width:1%;white-space:nowrap} td.n .in{justify-content:flex-end} td.n input.num{width:118px} td.n.day input.num{width:88px} td.mo{width:1%} td.mo select{width:136px}
tfoot td{font-weight:600;border-bottom:0;white-space:nowrap}
.intro{display:flex;flex-direction:column;gap:8px} .intro>p{max-width:none} .intro .more{display:flex;flex-direction:column;gap:8px;border-left:2px solid var(--line);padding-left:12px}
.lnk{border:0;background:transparent;padding:0;margin-left:4px;font:inherit;color:var(--water);cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px;white-space:nowrap} .lnk:hover{color:var(--ink)}
/* название строки — как текст: рамка появляется только при вводе */
input.ttl{width:100%;border-color:transparent;background:transparent;font-weight:500;color:var(--ink);text-overflow:ellipsis;cursor:text}
input.ttl:hover{border-color:transparent;background:var(--sunken)}
input.ttl:focus-visible{background:var(--field);border-color:var(--field-hot)}
