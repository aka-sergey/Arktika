<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Завод воды АРКТИКА</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Раскладка: табло цели сверху, под ним главная сцена — лента времени с дорожками, ниже рабочие вкладки со списками и рычагами */
:root{
  /* Единый тёмный вид: пульт наблюдения + крипто-терминал. Зелёный — деньги и «в плюсе», красный — траты и «в минусе», жёлтый — акцент и внимание, бирюзовый — склад. */
  --bg:#0B0E11; --surface:#12161C; --sunken:#1B212B; --ink:#EAECEF; --muted:#8A94A3; --line:#262D38;
  --brand:#16C784; --brand-soft:#0E2C22; --on-brand:#06120D;
  --accent:#F0B90B; --on-accent:#14110A; --accent-ink:#F0B90B;
  --field:#1B212B; --field-line:#647082; --field-hot:#F0B90B;
  --water:#22D3EE; --water-soft:#0C2A33; --amber:#F0B90B; --amber-soft:#2C2408; --red:#F6465D; --red-soft:#34151B; --gold:#FFE08A;
  --office:#A78BFA; --office-soft:#221C3D;
  --display:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace; --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --body:'Golos Text',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:6px; color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#F3F4F7; --surface:#FFFFFF; --sunken:#E9ECF1; --ink:#0B0E11; --muted:#5B6472; --line:#D5DAE2;
  --brand:#0E9F6E; --brand-soft:#DAF2E8; --on-brand:#FFFFFF;
  --accent:#F0B90B; --on-accent:#14110A; --accent-ink:#8F6400;
  --field:#F6F7F9; --field-line:#8590A0; --field-hot:#9A6B00;
  --water:#0A8FB0; --water-soft:#D6F0F6; --amber:#A66E00; --amber-soft:#FBF0CC; --red:#D9304A; --red-soft:#FBE0E4; --gold:#C99400;
  --office:#6D4FE0; --office-soft:#E7E1FB; color-scheme:light } }
:root[data-theme="light"]{
  --bg:#F3F4F7; --surface:#FFFFFF; --sunken:#E9ECF1; --ink:#0B0E11; --muted:#5B6472; --line:#D5DAE2;
  --brand:#0E9F6E; --brand-soft:#DAF2E8; --on-brand:#FFFFFF;
  --accent:#F0B90B; --on-accent:#14110A; --accent-ink:#8F6400;
  --field:#F6F7F9; --field-line:#8590A0; --field-hot:#9A6B00;
  --water:#0A8FB0; --water-soft:#D6F0F6; --amber:#A66E00; --amber-soft:#FBF0CC; --red:#D9304A; --red-soft:#FBE0E4; --gold:#C99400;
  --office:#6D4FE0; --office-soft:#E7E1FB; color-scheme:light }
html{background:var(--bg)}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;font-variant-numeric:tabular-nums}
.wrap{max-width:1480px;margin:0 auto;padding-block:16px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--water);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand h1{font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:.04em;text-transform:uppercase}
.brand span{color:var(--muted);font-size:13px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-width:0;max-width:100%}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.ghost{background:transparent}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:default}
select,input{border:1px solid var(--field-line);background:var(--field);border-radius:6px;padding:6px 8px;min-width:0;transition:border-color .12s,box-shadow .12s}
select:hover,input:hover{border-color:var(--field-hot)}
select:focus-visible,input:focus-visible{outline:none;border-color:var(--field-hot);box-shadow:0 0 0 2px var(--field-hot)}
input[type=checkbox]{box-shadow:none}
input.num{text-align:right;width:100%;min-width:88px;max-width:140px;font-family:var(--mono);font-size:13px}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
/* табло */
.score{display:grid;grid-template-columns:minmax(260px,1.25fr) repeat(4,minmax(150px,1fr));gap:0;overflow:hidden}
.goal{padding:16px 18px;background:var(--sunken);display:flex;flex-direction:column;gap:8px;justify-content:center}
.goal .led{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;background:var(--red);box-shadow:0 0 10px var(--red)} .goal.ok .led{background:var(--brand);box-shadow:0 0 10px var(--brand)}
.goal .verdict{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--red)} .goal.ok .verdict{color:var(--brand)}
.goal .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.goal b{font-size:16px;font-weight:600;line-height:1.3}
.goal .status{font-size:13px;color:var(--muted)}
.debt{height:8px;border-radius:2px;background:var(--bg);overflow:hidden}
.debt i{display:block;height:100%;border-radius:2px}
.metric{padding:14px 16px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:3px;min-width:0}
.metric .lab{color:var(--muted);font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.metric .val{font-family:var(--display);font-weight:700;font-size:23px;letter-spacing:-.02em;white-space:nowrap}
.metric .val small{font-family:var(--body);font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0}
.delta{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.delta.good{color:var(--brand)} .delta.bad{color:var(--red)}
.missions{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 10px 4px 6px;font-size:12.5px;background:var(--surface);color:var(--muted)}
.chip i{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line);display:inline-grid;place-items:center;font-style:normal;font-size:10px;line-height:1}
.chip.done{color:var(--ink);border-color:var(--brand)} .chip.done i{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.chip.record{border-color:var(--accent);color:var(--ink)} .chip.record i{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.alerts{display:flex;flex-direction:column;gap:6px}
.alert{border-radius:8px;padding:8px 12px;font-size:13px;display:flex;gap:10px;align-items:baseline;background:var(--amber-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--amber) 35%,transparent)}
.alert.err{background:var(--red-soft);border-color:color-mix(in srgb,var(--red) 40%,transparent)}
.alert b{color:var(--amber);font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap} .alert.err b{color:var(--red)}
/* лента времени */
.tl{padding:12px 0 6px;display:flex;flex-direction:column;gap:8px}
.tl-head{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;padding:0 14px}
.tl-head h2{font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 11px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:600}
.tl-body{display:grid;grid-template-columns:138px minmax(0,1fr)}
.tl-labels{position:relative;border-right:1px solid var(--line)}
.tl-labels div{position:absolute;left:14px;right:8px;font-size:12px;line-height:1.25}
.tl-labels b{display:block;font-weight:600;font-size:12.5px}
.tl-labels span{color:var(--muted);font-size:11px}
.tl-scroll{overflow-x:auto;overflow-y:hidden;position:relative}
.tl-scroll svg{display:block;touch-action:pan-x pan-y}
.tl-scroll svg text{font-family:var(--mono);font-size:10px;fill:var(--muted)}
.tl-scroll svg .t-ink{fill:var(--ink)} .tl-scroll svg .t-on{fill:var(--on-brand)} .tl-scroll svg .t-b{font-weight:600}
[data-drag]{cursor:grab;touch-action:none} [data-drag]:hover{filter:brightness(1.15)}
.tip{position:absolute;top:50px;z-index:3;pointer-events:none;background:var(--surface);border:1px solid var(--accent);border-radius:4px;padding:9px 11px;font-size:12px;width:276px;box-shadow:0 8px 28px rgba(0,0,0,.55)}
.tip h4{margin:0 0 5px;font-size:12.5px} .tip dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 10px} .tip dt{color:var(--muted)} .tip dd{margin:0;text-align:right;font-weight:500;font-family:var(--mono);font-size:11.5px}
.tip ul{margin:6px 0 0;padding:6px 0 0;border-top:1px solid var(--line);list-style:none;display:flex;flex-direction:column;gap:2px}
.tip li{display:flex;justify-content:space-between;gap:8px} .tip li span:last-child{white-space:nowrap;font-weight:500}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11.5px;color:var(--muted);padding:0 14px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
/* вкладки */
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);padding:0 8px}
.tabs button{border:0;background:transparent;padding:11px 12px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--accent-ink);border-bottom-color:var(--accent)}
.panel{padding:16px;display:flex;flex-direction:column;gap:16px;min-width:0}
.panel h3{font-family:var(--mono);font-size:12.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase}
.panel p{margin:0;color:var(--muted);max-width:75ch}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-weight:500;color:var(--muted);font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:4px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right} td.r{font-family:var(--mono);font-size:12.5px} td.calc,span.calc{color:var(--muted);white-space:nowrap;font-family:var(--mono);font-size:12.5px}
td input,td select{width:100%} td input[type=checkbox]{width:auto}
td.name{min-width:240px;width:60%} td.n{width:1%;white-space:nowrap} td.n .in{justify-content:flex-end} td.n input.num{width:118px} td.n.day input.num{width:88px} td.mo{width:1%} td.mo select{width:136px}
tfoot td{font-weight:600;border-bottom:0;white-space:nowrap}
.x{border:0;background:transparent;color:var(--muted);font-size:16px;line-height:1;padding:4px 6px;border-radius:6px} .x:hover{color:var(--red);background:var(--red-soft)}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px 18px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label{font-size:12.5px;font-weight:500}
.f .in{display:flex;align-items:center;gap:6px} .f .in input,.f .in select{flex:1}
.f .u{color:var(--muted);font-size:12px;white-space:nowrap}
.f small{color:var(--muted);font-size:11.5px;line-height:1.3}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bottle{display:flex;flex-direction:column;gap:10px}
.bottle .b{display:grid;grid-template-columns:70px minmax(0,1fr) 150px;gap:10px;align-items:center}
.stack{display:flex;height:26px;border-radius:6px;overflow:hidden;background:var(--sunken)}
.stack i{display:block;height:100%}
.lever{display:grid;grid-template-columns:minmax(180px,1.5fr) 120px minmax(120px,2fr) 110px 110px auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.lever .track{height:10px;background:var(--sunken);border-radius:5px;position:relative}
.lever .track i{position:absolute;top:0;bottom:0;border-radius:5px}
.jr{display:grid;grid-template-columns:96px minmax(0,1fr) 120px 120px;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.jr span:first-child{color:var(--muted)}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px 28px}
.rules h3{margin-bottom:6px} .rules ul,.rules ol{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px;color:var(--ink)} .rules p{color:var(--ink)}
.toast{font-weight:500;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:9px;font-size:13px;z-index:20;max-width:calc(100% - 32px)}
.namebox{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.scnlab{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)} .scnlab{min-width:0;max-width:100%} .scnlab select{font-family:var(--body);font-size:14px;letter-spacing:0;text-transform:none;color:var(--ink);min-width:0;max-width:min(100%,340px);text-overflow:ellipsis}
.btn.icon{padding:7px 9px;display:inline-flex;align-items:center} .btn.icon svg{display:block}
tr.cat td{background:var(--sunken);font-weight:600;font-size:12.5px;border-bottom:0;padding-top:7px;padding-bottom:7px}
.in{display:flex;align-items:center;gap:6px;min-width:0} .in input,.in select{flex:1;min-width:0} .in input.num{min-width:88px} .in input[type=checkbox]{flex:0 0 auto} .u{color:var(--muted);font-size:12px;white-space:nowrap}
.fr .in{justify-content:flex-end} td .in{width:100%}
.dm{flex:0 0 auto;width:16px;height:16px;padding:0;border:0;background:transparent;border-radius:50%;position:relative;cursor:pointer}
.dm::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 1px var(--surface)}
.dm:hover::after{inset:2px} .dm:focus-visible{outline:2px solid var(--field-hot);outline-offset:1px}
.rmchip{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.bres{background:var(--sunken);border-radius:5px;margin-top:8px;padding:2px 10px 4px} .bres h5{margin:6px 0 2px;font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:500} .bres .br>span:last-child{font-family:var(--mono);font-size:12.5px}
.linkbox{flex:1;min-width:0;overflow-wrap:anywhere;user-select:all;padding:6px 8px}
.grps{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px;align-items:start}
.grp{border:1px solid var(--line);border-radius:10px;padding:2px 14px 6px;min-width:0}
.grp h4{margin:10px 0 6px;font-family:var(--mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.grp h4 span{letter-spacing:0;text-transform:none;color:var(--accent-ink);font-weight:600}
.fr{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:12px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.fr label{font-weight:500;font-size:13px} .fr label small{display:block;font-weight:400;color:var(--muted);font-size:11.5px;line-height:1.3;margin-top:1px}
.bcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;align-items:stretch}
.bcard{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;grid-template-columns:92px minmax(0,1fr);gap:12px;min-width:0}
.bpic{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px} .bpic b{font-family:var(--display);font-weight:500;font-size:14px;white-space:nowrap}
.brows{display:flex;flex-direction:column;min-width:0}
.br{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,170px);gap:10px;align-items:center;padding:5px 0;border-top:1px solid var(--line);font-size:13px}
.br:first-child{border-top:0} .br>span:last-child{text-align:right} .br i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px}
.pubform{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end;border:1px solid var(--line);border-radius:6px;padding:12px 14px;background:var(--sunken)}
.pubform label{display:flex;flex-direction:column;gap:4px;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);flex:1;min-width:180px}
.pubform input{font-family:var(--body);font-size:14px;letter-spacing:0;text-transform:none;color:var(--ink)}
.sumcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;align-items:start}
.sumcards .grp{padding-bottom:10px} .sumnum{display:flex;gap:22px;padding:4px 0 8px;border-top:1px solid var(--line)} .sumnum small{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:1px} .sumnum .delta{font-size:17px;font-weight:700}
.sumcards ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:13px} .sumcards li.more{color:var(--muted);list-style:none;margin-left:-18px}
details.alld{border:1px solid var(--line);border-radius:6px;padding:0 12px} details.alld summary{cursor:pointer;padding:10px 0;font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)} details.alld[open] summary{border-bottom:1px solid var(--line);margin-bottom:6px}
.tops{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px;max-width:1000px} .tops li{padding-left:4px} .tops li span{margin-right:10px} .tops li b{white-space:nowrap;font-size:12.5px}
.panel code{font-family:var(--mono);font-size:12px;background:var(--sunken);padding:1px 5px;border-radius:3px;color:var(--ink)}
.panel p.bad{color:var(--red)} .panel p b{color:var(--ink)}
.tl-scroll::-webkit-scrollbar{height:12px} .tl-scroll::-webkit-scrollbar-track{background:var(--sunken)} .tl-scroll::-webkit-scrollbar-thumb{background:var(--muted);border-radius:6px;border:2px solid var(--sunken)}
@supports not selector(::-webkit-scrollbar){ .tl-scroll{scrollbar-color:var(--muted) var(--sunken)} }
#tl-svg.scrollable svg{cursor:grab} #tl-svg.panning svg{cursor:grabbing} #tl-svg.panning{user-select:none}
.col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px}
.colcap{font-size:10.5px;color:var(--muted)} .colbar{flex:1;width:34px;display:flex;flex-direction:column-reverse;border-radius:3px 3px 1px 1px;overflow:hidden;background:var(--sunken);border:1px solid var(--line);gap:1.5px}
.colbar i{display:flex;align-items:center;justify-content:center;font-style:normal;min-height:0} .colbar em{font-style:normal;font-family:var(--mono);font-size:10.5px;font-weight:700;color:#0B0E11;white-space:nowrap}
.cols2{display:flex;gap:8px;align-items:flex-end}
.bcard.solo{grid-template-columns:minmax(0,1fr)}

    <div><h3>Как считаются деньги</h3><ul><li>Инвестор вносит 1-го числа ровно столько, чтобы в конце месяца на счёте остался неснижаемый остаток.</li><li>Зарплата и взносы — 10-го и 25-го. Аренда — 1-го. Партии материалов — 15-го. Налоги — 28-го.</li><li>Выручка приходит равномерно по дням; часть — в следующем месяце (отсрочка покупателям).</li><li>Материалы попадают в расходы, когда воду разлили, а деньги уходят, когда оплатили партию.</li><li>«Резерв» у строки вложений добавляет к ней процент на непредвиденное; платится в том же месяце.</li><li>Окупаемость — месяц, когда накопленный денежный поток без денег инвестора стал неотрицательным.</li></ul></div>
    <div><h3>Производство и продажи</h3><ul><li>Мощность = сумма по типам (штук × литров в сутки) × коэффициент использования × дни.</li><li>Завод разливает столько, сколько нужно по плану продаж плюс целевой запас, но не больше мощности воды и линии.</li><li>Продано = меньшее из плана и того, что есть на складе с учётом розлива.</li><li>Докупили установки, но не подняли план продаж — мощность простаивает, деньги потрачены зря.</li></ul></div>
    <div><h3>Паллеты</h3><ul><li>Бутылок на паллете = упаковок в слое × штук в упаковке × слоёв.</li><li>Упаковок в слое — сколько прямоугольников упаковки встаёт рядами на 1200 × 800 или 1200 × 1000.</li><li>Слоёв — сколько проходит и по высоте груза, и по весу.</li><li>Паллеты и стрейч-плёнка расходуются на каждую разлитую паллету и покупаются партиями, как крышки.</li></ul></div>
    <div><h3>Тревоги</h3><ul><li><b>Материал закончился</b> — заказ сделан поздно или партия мала.</li><li><b>Кассовый разрыв</b> — в середине месяца на счёте минус, хотя в конце плюс. Увеличьте неснижаемый остаток.</li><li><b>Линия не успевает</b> — нужна вторая смена.</li><li><b>План выше производства</b> — не хватает воды или линии.</li><li><b>Лимиты УСН</b> — доход за год вышел за порог, налоги будут выше.</li></ul></div>
    <div><h3>Excel и допущения</h3><ul><li>«Скачать Excel» выгружает текущий сценарий: «Кейс» с формулами, «Персонал», «Вложения», «Установки» (типы и партии), «Продажи», подневные остатки, журнал и справку. Итоги в файле и на экране совпадают.</li><li>Обратно из Excel сценарий не загружается — правьте здесь, выгружайте заново.</li><li>Оклады по ролям, размеры бутылок, цены паллет и стрейч-плёнки — оценки; пресс-формы бутылок и транспорт крышек стоят нулями.</li><li>Амортизации нет: игра считает деньги, а не бухгалтерскую прибыль.</li></ul></div></div>`;

  function renderTabs() {

  function render() { renderHeader(); renderScore(); renderTimeline(); renderTabs(); }

  const FLD = { type: 'тип', cat: 'раздел', start: 'штук на старте', name: 'название', group: 'группа', salary: 'оклад', from: 'работает с', to: 'работает по', amount: 'сумма', month: 'месяц', day: 'день оплаты', reserve: 'резерв', qty: 'штук', l: 'литров в сутки', price: 'цена', liters: 'план, л в месяц', moq: 'партия', lead: 'заказ за месяцев', first: 'первый заказ', ship: 'транспорт партии' };
  document.addEventListener('change', e => {

    const it = s[LIST[kind]].find(x => x.id === id); if (!it) return; const old = it[field];
    if (field === 'day') v = clamp(v, 1, 28); if (field === 'from' && v > it.to) v = it.to; if (field === 'to' && v < it.from) v = it.from;
    if (old === v) { rerender(); return; }
    const who = kind === 'staff' ? (it.name || 'Сотрудник') : kind === 'capex' ? '«' + it.name + '»' : kind === 'batch' ? 'Партия ' + tOf(s, it.type).name + ' ×' + it.qty : 'План продаж с ' + mLabel(it.month), dz = x => field === 'type' ? tOf(s, x).name : disp(x, f);
    act(field === 'name' ? `Переименовано: ${old} → ${v}` : `${who}, ${FLD[field]}: ${dz(old)} → ${dz(v)}`, () => { it[field] = v; });
  });
  function loadScn(val) { if (val.indexOf('web:') === 0) { openWeb(val.slice(4)); return; } const pub = val.indexOf('pub:') === 0, name = val.replace(/^(pub|my):/, ''), src = name === 'База' && !pub && val === 'База' ? BASE_S : pub ? shared[name] : st.saved[name]; if (!src) return;
    undo.push(JSON.stringify({ s: st.s, journal: st.journal })); st.s = migrate(clone(src)); st.s.name = name; st.journal = []; res = S.sim(st.s); afterChange(); toast('Открыт сценарий «' + name + '»' + (pub ? ' из общих' : '')); }
  function importFile(inp) { const f = inp.files && inp.files[0]; if (!f) return; const rd = new FileReader();

  async function xlsx() {
    if (!window.ExcelJS) { toast('Не загрузилась библиотека Excel. Проверьте интернет и обновите страницу.'); return; }

    try {
      const sd = summaryData(), b = window.Xls.build(window.ExcelJS, st.s, res, st.journal.slice().reverse(), { kpi: sd.kpi, rows: sd.groups.reduce((a, g) => a.concat([[g.name, 'Раздел целиком', g.dInv, g.dCum]], g.items.map(x => [g.name, x.text, x.dInv, x.dCum])), []) }), buf = await b.wb.xlsx.writeBuffer();
      const fname = 'АРКТИКА_' + st.s.name.replace(/[^0-9A-Za-zА-Яа-яЁё-]+/g, '_') + '.xlsx', blob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });

  document.addEventListener('click', e => {
    const t = e.target.closest('[data-act]'); if (!t) return; const a = t.dataset.act.split(':'), s = st.s, p = s.p;

      case 'delscn': if (st.saved[s.name]) { const n = s.name; delete st.saved[n]; persist(); render(); toast('Сценарий «' + n + '» удалён из сохранённых'); } break;
      case 'xlsx': xlsx(); break;
      case 'clearj': st.journal = []; persist(); renderTabs(); break;
      case 'tm': st.tmAll = a[1] === '1'; renderTabs(); break;
      case 'tmc': st.tmCol = a[1]; renderTabs(); break;
      case 'rev': { const kind = a[1], id = a[2], field = a[3], r = baseOf(kind, id, field); if (!r || r.added) break; const f = kind === 'p' ? Meta.by[id].fmt : ({ salary: 'money', amount: 'money', ship: 'money', price: 'money', from: 'month', to: 'month', month: 'month', first: 'month', group: 'group', reserve: 'bool' }[field] || 'int');
        const sh = v => kind === 'p' ? dvP(id, v) : (field === 'name' || field === 'cat') ? v : field === 'type' ? tOf(BASE_S, v).name : disp(v, f);
        if (kind === 'p') act(`Возврат к базе — ${Meta.by[id].label}: ${sh(r.cur)} → ${sh(r.base)}`, () => { s.p[id] = BASE_S.p[id]; });
        else if (kind === 'ut') { const un = s.utypes.find(x => x.id === id); act(`Возврат к базе — ${un.name}, ${FLD[field]}: ${sh(r.cur)} → ${sh(r.base)}`, () => { un[field] = r.base; }); }
        else if (kind === 'mat') { const mt = s.mats.find(x => x.key === id); act(`Возврат к базе — ${mt.name}, ${FLD[field]}: ${sh(r.cur)} → ${sh(r.base)}`, () => { mt[field] = r.base; }); }
        else if (kind === 'contrib') act(`Возврат к базе — факт взноса за ${mLabel(+id)} убран`, () => { delete s.contrib[id]; });
        else { const it = s[kind].find(x => x.id === id), b = DIFF[kind].get(id); act(`Возврат к базе — ${it.name || 'План продаж'}, ${FLD[field] || field}: ${sh(r.cur)} → ${sh(r.base)}`, () => { it[field] = b[field]; }); }

      case 'tokdel': try { localStorage.removeItem(TOKKEY); } catch (x) { } renderTabs(); toast('Токен удалён из браузера'); break;
      case 'pub1': { const n = a.slice(1).join(':'), src = st.saved[n]; if (!src) break; const map = Object.assign({}, shared); map[n] = clone(src); t.disabled = true; publish(map, 'Общий сценарий: ' + n).then(ok => { if (ok) { render(); toast('«' + n + '» опубликован. Остальные увидят его через одну-две минуты.'); } else t.disabled = false; }); break; }

      case 'sharelink': pack(st.s).then(code => { shareUrl = location.origin + location.pathname + '#s=' + code; renderTabs(); const inp = $('shareurl'); if (inp) selText(inp); if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(shareUrl).then(() => toast('Ссылка скопирована'), () => toast('Ссылка ниже — выделите и скопируйте её')); else toast('Ссылка ниже — выделите и скопируйте её'); }); break;

      case 'add':
        if (a[1] === 'staff') act('Добавлен сотрудник: Новый сотрудник, 60 000 ₽', () => { s.staff.push({ id: newId(), name: 'Новый сотрудник', group: 'prod', salary: 60000, from: Math.max(1, p.start_m - 1), to: N }); });
        if (a[1] === 'capex') act('Добавлена строка вложений (сумма пока 0)', () => { s.capex.push({ id: newId(), cat: 'Прочее', name: 'Новая строка', amount: 0, month: 2, day: 10, reserve: true, auto: null }); });
        if (a[1] === 'batch') { const u = tOf(s, a[2]); act('Добавлена партия: 10 × ' + u.name + ', запуск ' + mLabel(10), () => { s.batches.push({ id: newId(), type: a[2], qty: 10, month: 10 }); }); }
        if (a[1] === 'plan') { const last = s.plan.slice().sort((x, y) => y.month - x.month)[0], mo = Math.min(N, last.month + 6); act('Добавлен уровень плана продаж с ' + mLabel(mo), () => { s.plan.push({ id: newId(), month: mo, liters: last.liters }); }); }
        break;
      case 'del': { const arr = s[LIST[a[1]]], it = arr.find(x => x.id === a[2]); if (!it) break;
